<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AEGIS AI Security</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif;
      -webkit-app-region: drag;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
    }
    .logo-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Ambient outer glow pulse behind logo */
    .glow-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.45) 0%, rgba(14, 165, 233, 0.2) 50%, transparent 70%);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }
    .logo-img {
      position: relative;
      width: 240px;
      height: 240px;
      object-fit: contain;
      z-index: 2;
      animation: floatLogo 3s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.55));
    }
    .title-area {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 3;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 20%, #67e8f9 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
    }
    .sub-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #94a3b8;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 12px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }
    .progress-bar-container {
      margin-top: 16px;
      width: 180px;
      height: 3px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #38bdf8, #818cf8);
      border-radius: 9999px;
      animation: indeterminate 1.8s infinite ease-in-out;
      transform-origin: 0% 50%;
    }
    .status-text {
      margin-top: 8px;
      font-size: 10px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.86);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        opacity: 0.5;
        filter: blur(14px);
      }
      100% {
        transform: scale(1.15);
        opacity: 0.9;
        filter: blur(20px);
      }
    }
    @keyframes floatLogo {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-4px);
      }
    }
    @keyframes indeterminate {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(20%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>
